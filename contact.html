<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - Oliu Mihai</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
  <header>
    <h1>Oliu Mihai</h1>
    <p>Student Inginerie Calculatoare</p>
    <div class="contact">
      <span>Email: oliumihai@gmail.com</span> |
      <span>Telefon: +40 787 864 964</span>
    </div>
  </header>
  <nav>
    <ul>
      <li><a href="index.html">Despre</a></li>
      <li><a href="experienta.html">Experiență</a></li>
      <li><a href="proiecte.html">Proiecte</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>
  <main>
    <form id="contact-form" action="https://formspree.io/f/xbjnqpyz" method="POST" novalidate>
        <div class="form-group">
          <label for="name">Nume complet <span class="required">*</span></label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            placeholder="Numele tău" 
            required 
            aria-describedby="name-error"
          />
          <span id="name-error" class="error-text" aria-live="polite"></span>
        </div>
      
        <div class="form-group">
          <label for="email">Adresă de e-mail <span class="required">*</span></label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="email@domeniu.com" 
            required 
            aria-describedby="email-error"
          />
          <span id="email-error" class="error-text" aria-live="polite"></span>
        </div>
      
        <div class="form-group">
          <label for="subject">Subiect <span class="required">*</span></label>
          <input 
            type="text" 
            id="subject" 
            name="subject" 
            placeholder="Despre ce este vorba?" 
            required 
            aria-describedby="subject-error"
          />
          <span id="subject-error" class="error-text" aria-live="polite"></span>
        </div>
      
        <div class="form-group">
          <label for="message">Mesaj <span class="required">*</span></label>
          <textarea 
            id="message" 
            name="message" 
            rows="5" 
            placeholder="Scrie mesajul tău aici..." 
            required 
            minlength="10"
            aria-describedby="message-error"
          ></textarea>
          <span id="message-error" class="error-text" aria-live="polite"></span>
        </div>
      
        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-paper-plane"></i> Trimite mesajul
        </button>
      </form>
      
      <div id="form-status" class="form-status" aria-live="assertive"></div>
  </main>

  <script src="main.js"></script>
</body>
</html>
